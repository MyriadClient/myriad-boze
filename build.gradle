// The Myriad addon plugin sets up what every addon has: Loom, Minecraft, Fabric and Myriad at the versions that Myriad
// release was built with, the dev client and its switches (with Essentials), checkApiOnly, the LICENSE in the jar and
// publishing. `-PcoreDir=../myriad` builds against a core checkout next to this one. What's below is Boze's own.
plugins {
	id 'dev.myriadclient.addon' version '1.1.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Boze publishes its addon API (and the Orbit event bus it uses) here.
	maven {
		name = "Boze"
		url = "https://maven.boze.dev/releases"
	}
}

dependencies {
	// Boze's public addon API: compiled against only. At runtime Boze itself provides these classes; without Boze the
	// addon notices and bridges nothing.
	compileOnly "dev.boze:boze-api:${project.boze_api_version}+${project.minecraft_version}"

	// Tests build Boze modules from the API jar and drive them without the client.
	testImplementation "dev.boze:boze-api:${project.boze_api_version}+${project.minecraft_version}"
	testRuntimeOnly "meteordevelopment:orbit:${project.orbit_version}"
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}
